name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality
        run: pnpm quality && pnpm deployment:verify

      - name: Verify SharePoint provisioning plan (no corporate access)
        run: pnpm portable:provision:dry-run
        env:
          PORTABLE_SHAREPOINT_SITE_ID: synthetic-site

      - name: Install browser for portable UI smoke
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Portable UI smoke with signed synthetic identity and simulated Graph
        run: pnpm portable:smoke

      - name: Upload synthetic portable smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h10b-portable-smoke-synthetic
          path: tmp/portable-smoke/**
          if-no-files-found: ignore


  database-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: covex_training_ci
          POSTGRES_USER: covex
          POSTGRES_PASSWORD: covex_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U covex -d covex_training_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://covex:covex_ci@localhost:5432/covex_training_ci?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations to empty PostgreSQL
        run: pnpm db:deploy

      - name: Seed PostgreSQL
        run: pnpm db:seed

      - name: Verify migration status
        run: pnpm exec prisma migrate status


  docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build portable Docker image
        run: docker build -t covex-training-manager:ci .

      - name: Prepare isolated deployment configuration
        run: |
          node tests/deployment/prepare.mjs
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -keyout tls/privkey.pem -out tls/fullchain.pem -subj /CN=localhost

      - name: Production deployment smoke (without corporate credentials)
        run: bash tests/deployment/smoke.sh

      - name: Deployment diagnostics on failure (CI data only)
        if: failure()
        run: docker compose --env-file deploy/.env.production -f docker-compose.production.yml -f tests/deployment/compose.ci.yml logs --tail 100 app gateway oauth2-proxy

      - name: Clean isolated deployment
        if: always()
        run: docker compose --env-file deploy/.env.production -f docker-compose.production.yml -f tests/deployment/compose.ci.yml down -v


  portable-windows:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Verify portable adapters
        run: pnpm portable:verify

      - name: Verify desktop lifecycle and security
        run: pnpm portable:desktop:verify

      - name: Build Windows portable release candidate
        run: |
          pnpm portable:package:win 2>&1 | Tee-Object -Variable buildOutput
          if ($LASTEXITCODE -ne 0) {
            $detail = ($buildOutput | Select-Object -Last 40) -join "`n"
            $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows packaging::$detail"
            exit 1
          }

      - name: Run extracted Windows EXE (native UI, lifecycle, isolation and package hash)
        run: |
          pnpm portable:desktop:smoke 2>&1 | Tee-Object -Variable smokeOutput
          if ($LASTEXITCODE -ne 0) {
            $detail = ($smokeOutput | Select-Object -Last 40) -join "`n"
            $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows EXE acceptance::$detail"
            exit 1
          }

      - name: Install browser for signed-identity regression
        run: pnpm exec playwright-core install chromium

      - name: Portable UI with signed synthetic identity and simulated Graph on Windows
        run: pnpm portable:smoke

      - name: Upload Windows release candidate
        uses: actions/upload-artifact@v4
        with:
          name: covex-training-manager-portable-windows-h10c
          path: |
            dist-portable/*.zip
            dist-portable/*.sha256
            dist-portable/BUILD_MANIFEST.json
          if-no-files-found: error

      - name: Upload synthetic Windows acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h10c-windows-acceptance-synthetic
          path: |
            tmp/desktop-smoke/**
            tmp/portable-smoke/**
          if-no-files-found: ignore
